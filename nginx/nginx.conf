events {}
 
http {
    # WebSocket support (Vite / HMR)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
 
    # =========================
    # HTTPS ENTRYPOINT
    # =========================
    server {
        listen 443 ssl;
        server_name 10.240.138.254;
 
        ssl_certificate     /etc/nginx/certs/10.240.138.254.pem;
        ssl_certificate_key /etc/nginx/certs/10.240.138.254-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
 
        # =========================
        # BACKEND (FastAPI)
        # =========================
        location /api/ {
            proxy_pass http://backend:8000/;
            proxy_http_version 1.1;
 
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
 
            # VERY IMPORTANT: pass Bearer token
            proxy_set_header Authorization $http_authorization;
        }
 
        # =========================
        # KEYCLOAK
        # =========================
        location /realms/ {
            proxy_pass http://keycloak:8080/realms/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
 
        location /resources/ {
            proxy_pass http://keycloak:8080/resources/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
 
        location /admin/ {
            proxy_pass http://keycloak:8080/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
 
        # =========================
        # FRONTEND (React / Vite)
        # =========================
        location / {
            proxy_pass http://frontend-trainee:5173;
            proxy_http_version 1.1;
 
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
 
    # =========================
    # HTTP → HTTPS REDIRECT
    # =========================
    server {
        listen 80;
        server_name 10.240.138.254;
        return 301 https://$host$request_uri;
    }
}