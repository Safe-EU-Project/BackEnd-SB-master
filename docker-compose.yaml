version: '3.9'

services:
  # PostgreSQL for Keycloak:
  postgres:
    image: postgres:16
    container_name: safe_keycloak_postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - safe_postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak -d keycloak']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Keycloak authentication server:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.0
    container_name: safe_keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_PROXY: edge
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: false
      KC_HTTP_ENABLED: true
      KC_PROXY_HEADERS: xforwarded
    command:
      - start-dev
    ports:
      - '8480:8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  # MongoDB for the Backend Service:
  mongodb:
    image: mongo:7
    container_name: safe_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - '27117:27017'
    volumes:
      - safe_mongo_data:/data/db
    restart: always

  # MongoDB Web UI — browse collections, edit documents:
  mongo-express:
    image: mongo-express:latest
    container_name: safe_mongo_express
    ports:
      - '8481:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://root:password@safe_mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      - mongodb
    restart: always

  # MongoDB Query UI — run full queries, aggregations, pipelines:
  # mongoku:
  #   image: huggingface/mongoku:latest
  #   container_name: mongoku
  #   ports:
  #     - '3100:3100'
  #   environment:
  #     MONGOKU_DEFAULT_HOST: mongodb://root:password@mongodb:27017/?authSource=admin
  #   depends_on:
  #     - mongodb
  #   restart: always

  safe-backend:
    build:
      context: ./Backend
      dockerfile: dockerfile
    container_name: safe_backend
    ports:
      - '9000:8000'
    volumes:
      - ./Backend:/app
    env_file:
      - ./Backend/.env
    command: ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      - mongodb
      - keycloak
    restart: always

